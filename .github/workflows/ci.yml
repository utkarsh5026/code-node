name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# uv fails instead of changing uv.lock when it no longer matches pyproject.toml.
env:
  UV_LOCKED: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - run: uv run --only-group package python -m build
      - name: Check the metadata, and that the README renders on PyPI
        run: uv run --only-group package twine check --strict dist/*
      - name: Install the wheel alone and run the command on the example
        run: |
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          "$RUNNER_TEMP/wheel/bin/code-node" examples/orders-service --no-open -o "$RUNNER_TEMP/page.html"

name: Release

# Publishes code-node-graph to PyPI when a GitHub release is published. Tag the release v<version>, with <version> the
# __version__ in src/code_node/__init__.py; the build stops if they differ. /release in Claude Code does the steps.
#
# One-time setup, before the first release:
#   1. On PyPI, Account settings -> Publishing -> Add a new pending publisher (GitHub): project name code-node-graph,
#      owner utkarsh5026, repository code-node, workflow release.yml, environment pypi.
#   2. Here, Settings -> Environments -> New environment "pypi" (add yourself as a required reviewer to approve
#      each upload).
# No PyPI token is stored anywhere: PyPI trusts this workflow's GitHub identity ("trusted publishing").

on:
  release:
    types: [published]

permissions:
  contents: read

# uv fails instead of changing uv.lock when it no longer matches pyproject.toml.
env:
  UV_LOCKED: "1"

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - run: uv run --only-group package python -m build
      - name: Check the metadata, and that the README renders on PyPI
        run: uv run --only-group package twine check --strict dist/*
      - name: Install the wheel, run it, and match the version to the tag
        run: |
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          "$RUNNER_TEMP/wheel/bin/code-node" examples/orders-service --no-open -o "$RUNNER_TEMP/page.html"
          version="$("$RUNNER_TEMP/wheel/bin/python" -c 'import code_node; print(code_node.__version__)')"
          if [ "$TAG" != "v$version" ]; then echo "release tag $TAG doesn't match __version__ $version"; exit 1; fi
        env:
          TAG: ${{ github.event.release.tag_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/code-node-graph/
    permissions:
      id-token: write # prove to PyPI that the upload comes from this workflow
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

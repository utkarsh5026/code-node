[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI blocks "code-node": it matches the existing "codenode" once the dash is dropped. The command stays code-node
# and the import stays code_node.
name = "code-node-graph"
dynamic = ["version"]
description = "See how Python code works without running it: a graph of who calls whom from an entry point, and what each path reaches."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Utkarsh Priyadarshi" }]
keywords = ["call graph", "static analysis", "ast", "code map", "aws", "boto3", "lambda", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
# botocore names AWS operations and their IAM actions from its own service models (no AWS call is ever made). PyYAML
# reads deploy files (template.yaml, serverless.yml).
dependencies = ["botocore>=1.35.72", "pyyaml>=6.0"]

# What working on code-node needs. None of it ships in the wheel. `uv sync` installs every group into .venv at the
# versions in uv.lock, and Dependabot proposes upgrades to both.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "rich==15.0.0",  # makefile.py's colours and tables
    "pillow==12.3.0",  # scripts/shots.py only (it also needs Chrome)
    { include-group = "package" },
]
# Builds the sdist and wheel and checks them as PyPI would.
package = ["build==1.6.1", "twine==7.0.0", "readme-renderer[md]==46.0"]
# Builds the docs site in docs/ (mkdocs.yml). MkDocs 2.0 drops plugins and themes, so Material for MkDocs needs 1.x
# (.github/dependabot.yml holds it there).
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7", "pymdown-extensions==12.3"]

[tool.uv]
default-groups = "all"

[project.urls]
Homepage = "https://github.com/utkarsh5026/code-node"
Documentation = "https://utkarsh5026.github.io/code-node/"
Changelog = "https://github.com/utkarsh5026/code-node/blob/main/CHANGELOG.md"
Issues = "https://github.com/utkarsh5026/code-node/issues"

[project.scripts]
code-node = "code_node.cli:main"

[tool.hatch.version]
path = "src/code_node/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/code_node"]

[tool.hatch.build.targets.sdist]
include = ["src/code_node", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
